<style>:root{--bg:#050D18;--panel:rgba(255,255,255,.055);--edge:rgba(255,255,255,.1);--line:rgba(159,182,203,.22);--text:#E8F1F8;--muted:#9FB6CB;--dim:#6E879E;--acc:#21D4FD;--volt:#0057FF;--up:#3CF0C5;--warn:#FFB547;--bad:#FF7A6B;--mono:"Geist Mono",ui-monospace,Menlo,monospace;--sans:Geist,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font:400 15.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}.hero{position:relative;min-height:230px;padding:calc(env(safe-area-inset-top) + 46px) 18px 18px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.hero>img,.hero>canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,24,0) 0%,rgba(5,13,24,0) 45%,rgba(5,13,24,.55) 80%,var(--bg) 100%);pointer-events:none}.hero h1,.hero .kick{text-shadow:0 2px 14px rgba(0,20,40,.55)}.hero>*:not(img):not(canvas){position:relative;z-index:1}.hero.earth{min-height:300px;background:radial-gradient(90% 70% at 50% 40%,#0a2238,#02060c)}.hero.earth:after{background:linear-gradient(180deg,rgba(5,13,24,0) 60%,var(--bg) 100%)}.kick{font:500 11px var(--mono);letter-spacing:.04em;color:#bfe6ff;text-transform:uppercase}.hero h1{font:600 27px/1.08 var(--sans);letter-spacing:-.035em;margin:6px 0 0}.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}.glass{margin-top:14px;background:#ffffff1a;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px}.glass b{font:600 22px var(--mono);letter-spacing:-.04em;display:block}.glass b.q{color:var(--up)}.glass span{display:block;font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase}main{padding:4px 14px 110px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#050d18d1;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--edge);padding:6px 4px calc(env(safe-area-inset-bottom) + 10px);z-index:5}nav button{background:none;border:0;color:var(--dim);font:500 11px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;justify-content:center;padding:0}nav button svg{width:22px;height:22px}nav button.on{color:#fff}nav button.on svg{color:var(--acc)}h3{font:500 11.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin:22px 4px 8px}h2{font:600 24px/1.1 var(--sans);letter-spacing:-.03em}.help{color:var(--muted);font-size:14px;margin:10px 4px 12px}input,select{width:100%;background:#ffffff0f;color:var(--text);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;font:16px var(--sans);outline:none}input:focus,select:focus{border-color:var(--acc)}select option{background:#0a1a2c}label{display:block;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}.btn{background:#ffffff0f;border:1px solid var(--edge);color:var(--text);border-radius:14px;padding:11px 16px;font:600 14px var(--sans);margin:10px 8px 0 0;min-height:44px}.btn.solid{background:var(--volt);border-color:var(--volt);color:#fff;box-shadow:0 10px 30px -12px #0057ffe6}.card{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:14px;margin:10px 0}.card[onclick]{cursor:pointer}.card[onclick]:active{transform:scale(.99)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.card .row+.row{margin-top:6px}.t{font-weight:600;letter-spacing:-.015em}.muted{color:var(--muted);font-size:13.5px}.badge{font:500 10.5px var(--mono);letter-spacing:.03em;border-radius:999px;padding:4px 9px;white-space:nowrap;background:#9fb6cb24;color:var(--muted)}.badge.QUIET{background:#3cf0c521;color:var(--up)}.badge.BUSY{background:#ffb54721;color:var(--warn)}.badge.PACKED{background:#ff7a6b24;color:var(--bad)}.wk{display:flex;gap:4px;margin:4px 0 10px;flex-wrap:wrap}.wk span{font:500 10.5px var(--mono);padding:3px 7px;border-radius:7px}.wk .f{background:#3cf0c51f;color:var(--up)}.wk .h{background:#ffb5471f;color:var(--warn)}.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;margin:12px 0 6px}.bars div{border-radius:5px 5px 2px 2px;min-height:3px}.bl{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font:500 10.5px var(--mono);color:var(--dim);text-align:center}.chips{display:flex;gap:6px;overflow-x:auto;margin:12px -14px 4px;padding:0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none;border:1px solid var(--edge);background:#ffffff0a;border-radius:999px;padding:7px 14px;font:500 13px var(--sans);color:var(--muted)}.chip.on{background:#fff;color:#06121f;border-color:#fff}.star{background:none;border:0;color:var(--warn);font-size:24px;padding:0 4px;min-width:44px;min-height:44px}.cabin{display:grid;grid-template-columns:repeat(2,1fr) 12px repeat(2,1fr);gap:6px 8px;margin-top:12px}.cabin i{height:22px;border-radius:7px 7px 4px 4px;border:1.5px solid rgba(159,182,203,.4)}.cabin i.on{background:#c9d8e6;border-color:#c9d8e6}.cabin u{height:22px}.big{font:600 30px/1 var(--mono);letter-spacing:-.05em}.gauge{display:flex;align-items:center;gap:14px}.gauge svg{width:58px;height:58px;flex:none}.mini{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;align-items:end;height:22px;margin-top:10px}.mini i{display:block;border-radius:2px}a{color:var(--acc)}b{font-weight:600}.seg{display:flex;background:#ffffff0d;border:1px solid var(--edge);border-radius:14px;padding:4px;margin:12px 0 4px}.seg button{flex:1;border:0;background:none;color:var(--muted);font:600 13px var(--sans);padding:9px 6px;border-radius:10px;min-height:38px}.seg button.on{background:#ffffff1f;color:#fff}.tools{display:flex;gap:8px;margin:10px 0 2px}.tools select{flex:1;padding:10px 12px;font-size:14px;border-radius:12px}.score{flex:none;width:52px;height:52px;position:relative}.score svg{width:52px;height:52px}.score b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 15px var(--mono);letter-spacing:-.04em}.item{display:flex;gap:12px;align-items:center}.item .grow{flex:1;min-width:0}.spark{display:block;width:100%;height:46px;margin-top:6px}.chart{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}.chart text{font-family:var(--mono);font-size:10px;fill:#6e879e}.tip{font:500 12.5px var(--mono);color:var(--muted);min-height:20px;margin-top:4px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kpi{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:11px 12px}.kpi small{display:block;font:500 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}.kpi b{display:block;font:600 21px var(--mono);letter-spacing:-.05em;margin-top:3px}.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:10px}.heat i{display:block;aspect-ratio:1;border-radius:6px}.insight{border-left:2px solid var(--acc);padding:2px 0 2px 12px;margin:10px 0;color:var(--text);font-size:14px}.hero canvas.ov{pointer-events:none}</style>
